steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '21'

  - name: Build and test Backend with Maven
    run: mvn clean verify
    working-directory: DevOps_TP1/tp-devops-correction-docker/simple-api